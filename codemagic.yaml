workflows:
  android-build:
    name: Android APK
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install Capacitor
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
      
      - name: Build Android APK
        script: |
          # Clean previous builds
          rm -rf android
          
          # Initialize Capacitor
          npx cap init "Solo System" "com.solosystem.app"
          npx cap add android
          npx cap sync
          npx cap copy
          
          # Build the APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - chetwinchli@gmail.com

  ios-build:
    name: iOS IPA
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install Capacitor
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/ios
      
      - name: Build iOS IPA
        script: |
          # Clean previous builds
          rm -rf ios
          
          # Initialize Capacitor
          npx cap init "Solo System" "com.solosystem.app"
          npx cap add ios
          npx cap sync
          npx cap copy
          
          # Build the IPA
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release build
    artifacts:
      - ios/App/build/Release-iphoneos/*.ipa
    publishing:
      email:
        recipients:
          - chetwinchli@gmail.com
