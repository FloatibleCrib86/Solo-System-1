workflows:
  android-build:
    name: Android APK
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install Capacitor
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
      
      - name: Create Capacitor Project
        script: |
          # Create a fresh capacitor project in a temp directory
          mkdir -p temp_project
          cd temp_project
          npx cap init "Solo System" "com.solosystem.app" --web-dir=../www
          npx cap add android
          # Copy the android folder back to main directory
          cp -r android ../
          cd ..
          rm -rf temp_project
      
      - name: Copy Web Files
        script: |
          # Ensure the web files are in the right place
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/
      
      - name: Sync Capacitor
        script: |
          npx cap sync
          npx cap copy
      
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - chetwinchli@gmail.com

  ios-build:
    name: iOS IPA
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install Capacitor
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/ios
      
      - name: Create Capacitor Project
        script: |
          mkdir -p temp_project
          cd temp_project
          npx cap init "Solo System" "com.solosystem.app" --web-dir=../www
          npx cap add ios
          cp -r ios ../
          cd ..
          rm -rf temp_project
      
      - name: Copy Web Files
        script: |
          mkdir -p ios/App/public
          cp -r www/* ios/App/public/
      
      - name: Sync Capacitor
        script: |
          npx cap sync
          npx cap copy
      
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release build
    artifacts:
      - ios/App/build/Release-iphoneos/*.ipa
    publishing:
      email:
        recipients:
          - chetwinchli@gmail.com
