workflows:
  android-build:
    name: Android APK
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install Capacitor with Local Notifications
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android @capacitor/local-notifications
      
      - name: Build Android APK
        script: |
          rm -rf android
          npx cap init "Solo System" "com.solosystem.app"
          npx cap add android
          npx cap sync
          npx cap copy
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - chetwinchli@gmail.com

  ios-build:
    name: iOS IPA
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install Capacitor with Local Notifications
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/ios @capacitor/local-notifications
      
      - name: Build iOS IPA
        script: |
          rm -rf ios
          npx cap init "Solo System" "com.solosystem.app"
          npx cap add ios
          npx cap sync
          npx cap copy
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release build
    artifacts:
      - ios/App/build/Release-iphoneos/*.ipa
    publishing:
      email:
        recipients:
          - chetwinchli@gmail.com
