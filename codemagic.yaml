workflows:
  android-build:
    name: Android APK - Signed Update
    instance_type: mac_mini_m1

    environment:
      node: 18
      android_signing:
        - solo_system_release_keystore
      vars:
        APP_VERSION_CODE: 8
        APP_VERSION_NAME: "1.7.0"

    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install
          npm install -g @capacitor/cli

      - name: Generate Capacitor Android project
        script: |
          set -e

          rm -rf android

          npx cap init "Solo System" "com.solosystem.app" --web-dir www || true
          npx cap add android
          npx cap sync android
          npx cap copy android

          mkdir -p android/app/src/main/res/drawable

          cat > android/app/src/main/res/drawable/ic_stat_icon_config_sample.xml <<'ICON'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#46EAFF"
                  android:pathData="M12,2L14.39,8.26L21,9L16,13.5L17.5,20L12,16.6L6.5,20L8,13.5L3,9L9.61,8.26L12,2Z" />
          </vector>
          ICON

      - name: Configure Android Gradle and release signing
        script: |
          set -e
          cd android

          if [ -z "$CM_KEYSTORE_PATH" ] || [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: Codemagic keystore was not found."
            echo "Upload the Android keystore in Codemagic with reference name: solo_system_release_keystore"
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          gradle_path = Path("app/build.gradle")

          if not gradle_path.exists():
              raise SystemExit("android/app/build.gradle was not found")

          text = gradle_path.read_text()

          version_code = os.environ.get("APP_VERSION_CODE", "8")
          version_name = os.environ.get("APP_VERSION_NAME", "1.7.0")

          android_match = re.search(r"android\s*\{", text)
          if not android_match:
              raise SystemExit("Could not find android { block in android/app/build.gradle")

          insert_after_android = ""

          if not re.search(r"\bcompileSdk(?:Version)?\b", text):
              insert_after_android += "\n    compileSdk 35"

          if "namespace" not in text:
              insert_after_android += '\n    namespace "com.solosystem.app"'

          if insert_after_android:
              pos = android_match.end()
              text = text[:pos] + insert_after_android + text[pos:]

          if re.search(r"versionCode\s+\d+", text):
              text = re.sub(r"versionCode\s+\d+", f"versionCode {version_code}", text)
          else:
              text = text.replace(
                  "defaultConfig {",
                  f"defaultConfig {{\n        versionCode {version_code}",
                  1
              )

          if re.search(r'versionName\s+"[^"]+"', text):
              text = re.sub(
                  r'versionName\s+"[^"]+"',
                  f'versionName "{version_name}"',
                  text
              )
          else:
              text = text.replace(
                  "defaultConfig {",
                  f'defaultConfig {{\n        versionName "{version_name}"',
                  1
              )

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs" not in text:
              if "    buildTypes" in text:
                  text = text.replace("    buildTypes", signing_block + "\n    buildTypes", 1)
              else:
                  text = text.replace("android {", "android {" + signing_block, 1)

          lines = text.splitlines()
          out = []
          in_build_types = False
          build_depth = None
          depth = 0
          already_has_release_signing = "signingConfig signingConfigs.release" in text

          for line in lines:
              stripped = line.strip()
              old_depth = depth

              starts_build_types = bool(re.match(r"buildTypes\s*\{", stripped))
              starts_release_build = in_build_types and bool(re.match(r"release\s*\{", stripped))

              out.append(line)

              depth += line.count("{") - line.count("}")

              if starts_build_types:
                  in_build_types = True
                  build_depth = old_depth + 1

              if starts_release_build and not already_has_release_signing:
                  out.append("            signingConfig signingConfigs.release")
                  already_has_release_signing = True

              if in_build_types and build_depth is not None and depth < build_depth:
                  in_build_types = False
                  build_depth = None

          text = "\n".join(out) + "\n"
          gradle_path.write_text(text)

          print("Patched android/app/build.gradle successfully.")
          PY

      - name: Build signed release APK
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - chetwinchli@gmail.com
