workflows:
  android-build:
    name: Android APK
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
      
      - name: Initialize Capacitor
        script: |
          # Create capacitor config
          cat > capacitor.config.json << EOF
          {
            "appId": "com.solosystem.app",
            "appName": "Solo System",
            "webDir": "src",
            "bundledWebRuntime": false
          }
          EOF
          
          # Initialize and add Android
          npx cap init "Solo System" "com.solosystem.app"
          npx cap add android
          npx cap copy
          npx cap sync
      
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - chetwinchli@gmail.com

  ios-build:
    name: iOS IPA
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install dependencies
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/ios
      
      - name: Initialize Capacitor
        script: |
          # Create capacitor config
          cat > capacitor.config.json << EOF
          {
            "appId": "com.solosystem.app",
            "appName": "Solo System",
            "webDir": "src",
            "bundledWebRuntime": false
          }
          EOF
          
          # Initialize and add iOS
          npx cap init "Solo System" "com.solosystem.app"
          npx cap add ios
          npx cap copy
          npx cap sync
      
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release build
    artifacts:
      - ios/App/build/Release-iphoneos/*.ipa
    publishing:
      email:
        recipients:
          - chetwinchli@gmail.com
