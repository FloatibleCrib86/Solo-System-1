workflows:
  android-build:
    name: Android APK
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install Capacitor
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
      
      - name: Clean and Build
        script: |
          # Remove existing android folder if it exists
          rm -rf android
          
          # Initialize with webDir = www
          npx cap init "Solo System" "com.solosystem.app" --web-dir=www
          npx cap add android
          npx cap copy
          npx cap sync
          
          # Build APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - chetwinchli@gmail.com

  ios-build:
    name: iOS IPA
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install Capacitor
        script: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/ios
      
      - name: Clean and Build
        script: |
          # Remove existing ios folder if it exists
          rm -rf ios
          
          npx cap init "Solo System" "com.solosystem.app" --web-dir=www
          npx cap add ios
          npx cap copy
          npx cap sync
          
          # Build iOS
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release build
    artifacts:
      - ios/App/build/Release-iphoneos/*.ipa
    publishing:
      email:
        recipients:
          - chetwinchli@gmail.com